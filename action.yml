name: 'devguard-scan'
description: >-
  Zero-dependency secret scanner (same engine as the devguard-scan browser
  demo, github.com/WRG-11/devguard-scan) -- run against a checked-out repo
  as a CI gate.
author: 'WRG-11'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Directory to scan, relative to the calling workflow checkout'
    required: false
    default: '.'
  include:
    description: 'Comma-separated include glob patterns (overrides the built-in list)'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated exclude glob patterns (overrides the built-in list)'
    required: false
    default: ''
  allowlist:
    description: >-
      Path to an allowlist JSON, relative to the calling workflow checkout.
      The gate NEVER auto-discovers <path>/.wrg/allowlist.json -- otherwise a
      scanned fork PR could ship a rule that suppresses its own finding. Point
      this at a file the workflow controls (e.g. one committed to the default
      branch and checked out separately) to allow known findings on purpose.
    required: false
    default: ''
  max-file-bytes:
    description: >-
      Skip files larger than this many bytes (default 1048576). Files skipped
      for size are reported in the files-scanned/skipped-oversize outputs, so
      raising or lowering this never silently changes what was examined.
    required: false
    default: ''

outputs:
  total-findings:
    description: 'Total finding count'
    value: ${{ steps.scan.outputs.total-findings }}
  error-count:
    description: 'ERROR-severity finding count'
    value: ${{ steps.scan.outputs.error-count }}
  status:
    description: '"PASS" or "FAIL"'
    value: ${{ steps.scan.outputs.status }}
  files-scanned:
    description: >-
      How many files were actually read. A gate that reports 0 findings over 0
      files is misconfigured, not clean -- assert on this in the calling
      workflow if the scanned path is generated rather than fixed.
    value: ${{ steps.scan.outputs.files-scanned }}
  skipped-oversize:
    description: 'Files skipped because they exceed max-file-bytes'
    value: ${{ steps.scan.outputs.skipped-oversize }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Run devguard-scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_INCLUDE: ${{ inputs.include }}
        SCAN_EXCLUDE: ${{ inputs.exclude }}
        SCAN_ALLOWLIST: ${{ inputs.allowlist }}
        SCAN_MAX_FILE_BYTES: ${{ inputs.max-file-bytes }}
      run: |
        set +e
        # --no-auto-allowlist unconditionally: as a gate this scans code it may
        # not control, and <path>/.wrg/allowlist.json lives inside that code. An
        # allowlist is honoured ONLY when the workflow points --allowlist at a
        # file it owns.
        ARGS=("$SCAN_PATH" "--json" "--no-auto-allowlist")
        [ -n "$SCAN_INCLUDE" ] && ARGS+=("--include" "$SCAN_INCLUDE")
        [ -n "$SCAN_EXCLUDE" ] && ARGS+=("--exclude" "$SCAN_EXCLUDE")
        [ -n "$SCAN_ALLOWLIST" ] && ARGS+=("--allowlist" "$SCAN_ALLOWLIST")
        [ -n "$SCAN_MAX_FILE_BYTES" ] && ARGS+=("--max-file-bytes" "$SCAN_MAX_FILE_BYTES")
        node "${{ github.action_path }}/bin/scan.mjs" "${ARGS[@]}" > devguard-scan-report.json
        SCAN_EXIT=$?
        set -e

        # Exit 2 means the scan never ran (missing path, bad input): there is no
        # report to parse, and treating it as anything other than a failure is
        # how a typo'd `path:` buys a permanently green check. Fail here rather
        # than letting the reader below die on an empty file with a JSON parse
        # error that says nothing about the cause.
        if [ "$SCAN_EXIT" -ne 0 ] && [ "$SCAN_EXIT" -ne 1 ]; then
          echo "::error::devguard-scan could not run (exit $SCAN_EXIT) -- see the message above. The scan did NOT pass; it did not happen."
          exit "$SCAN_EXIT"
        fi

        node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('devguard-scan-report.json', 'utf-8'));
          const s = r.summary;
          const lines = [
            \`total-findings=\${s.total_findings}\`,
            \`error-count=\${s.error}\`,
            \`status=\${r.status}\`,
            \`files-scanned=\${s.files_scanned}\`,
            \`skipped-oversize=\${s.skipped_oversize}\`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join('\n') + '\n');
          console.log(\`devguard-scan: \${s.total_findings} finding(s) (\${s.error} error, \${s.warning} warning) over \${s.files_scanned} file(s) -- \${r.status}\`);
          if (s.files_scanned === 0) {
            console.log('::warning::devguard-scan read 0 files. A clean result over an empty file set is not evidence of anything -- check the path and include patterns.');
          }
          for (const f of r.findings) {
            console.log(\`  \${f.severity.padEnd(7)} \${f.file}:\${f.line}:\${f.column}  \${f.rule_id}  \${f.message}\`);
          }
        "
        exit $SCAN_EXIT
