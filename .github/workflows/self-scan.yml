name: self-scan

# Dogfoods this repo's own action.yml against its own source (bin/scan.mjs
# + action.yml, exercised end-to-end via GitHub Actions rather than only
# locally) -- this doubles as the real-world usage example for consumers
# of `uses: WRG-11/devguard-scan@<ref>`. fixtures/ is excluded by the
# built-in DEFAULT_EXCLUDE, so a clean run is expected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run devguard-scan on itself
        uses: ./
        with:
          path: '.'
