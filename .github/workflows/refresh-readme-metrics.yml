name: Refresh README Metrics

# Recompute the <!-- METRIC:name --> markers in README.md and commit any change.
#
# The computation lives in scripts/readme_stamp.mjs rather than inline here, so
# the same command runs locally and as --check in the `docs` job of tests.yml.
# It used to be `grep -c "^    id:" scan.js`, which counted a text shape rather
# than a fact: reindenting the rule table would have changed the published rule
# count without a rule changing.
#
# Triggers on any push to main, not only on scan.js: the stamped numbers now
# include corpus findings and per-suite check counts, which move when fixtures/
# or scripts/ move. Public repo — GitHub Actions minutes are free.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Stamp metric markers
        run: node scripts/readme_stamp.mjs --write

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No changes to commit."
          else
            git add README.md
            git commit -m "chore(readme): auto-refresh metric markers [skip ci]"
            git push
          fi
