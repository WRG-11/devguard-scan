name: CodeQL

# CodeQL static security analysis for the client-side JavaScript.
#
# This repository is a dependency-free, zero-upload static site: the scan
# engine (scan.js), the UI glue (app.js) and the parity/test harness under
# scripts/ are all hand-written browser/Node JavaScript with no build step
# and no node_modules. CodeQL therefore runs with build-mode `none`, which
# analyzes the JS/TS source directly.
#
# Runs on every push / PR to the default branch plus a weekly scheduled
# scan. Findings surface in the repo Security tab -> Code scanning alerts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Monday 03:00 UTC

permissions:
  contents: read
  security-events: write   # required to upload SARIF results

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
